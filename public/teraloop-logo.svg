<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 460" width="100%" height="100%">
  <defs>
    <!-- Linear & Radial Gradients matching the Teraloop Logo -->
    <linearGradient id="tStemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#057a55" />
      <stop offset="40%" stop-color="#045a3f" />
      <stop offset="100%" stop-color="#023a28" />
    </linearGradient>

    <linearGradient id="tBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#02422e" />
      <stop offset="50%" stop-color="#057a55" />
      <stop offset="100%" stop-color="#0da871" />
    </linearGradient>

    <linearGradient id="ribbonLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#024f37" />
      <stop offset="35%" stop-color="#05855c" />
      <stop offset="70%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="ribbonRightGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="40%" stop-color="#10b981" />
      <stop offset="80%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#86efac" />
    </linearGradient>

    <linearGradient id="leafGrad1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="60%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>

    <linearGradient id="leafGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="70%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#86efac" />
    </linearGradient>

    <linearGradient id="infinityLoopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#023a28" flood-opacity="0.15" />
    </filter>
  </defs>

  <g id="teraloop-emblem" filter="url(#subtleShadow)">
    <!-- T Horizontal Top Bar -->
    <path d="M 130 55 C 130 45, 142 38, 158 38 L 322 38 C 338 38, 350 45, 350 55 C 350 72, 338 82, 320 82 L 284 82 L 284 88 L 196 88 L 196 82 L 160 82 C 142 82, 130 72, 130 55 Z" fill="url(#tBarGrad)" />

    <!-- T Vertical Stem -->
    <path d="M 205 75 L 275 75 C 278 75, 280 77, 280 80 L 280 220 C 280 228, 274 235, 266 235 L 214 235 C 206 235, 200 228, 200 220 L 200 80 C 200 77, 202 75, 205 75 Z" fill="url(#tStemGrad)" />

    <!-- Swirling Ribbon Loop (Behind/Around T) -->
    <!-- Left Loop of Ribbon -->
    <path d="M 215 130 C 175 105, 120 120, 110 165 C 100 205, 135 240, 175 235 C 205 230, 235 200, 270 170 C 310 135, 355 130, 385 160 C 400 175, 405 200, 395 220 C 385 242, 360 255, 335 250 C 320 247, 305 235, 298 222 C 308 238, 330 242, 345 238 C 365 232, 375 215, 372 195 C 368 175, 342 165, 315 185 C 275 215, 240 252, 195 255 C 145 258, 95 225, 95 170 C 95 120, 145 88, 198 108 C 220 116, 238 132, 252 148 L 225 162 C 215 145, 202 135, 190 130 Z" fill="url(#ribbonLeftGrad)" />

    <!-- Upper Ribbon Surface with Bright Green Flow -->
    <path d="M 125 168 C 120 135, 155 110, 190 120 C 225 130, 260 180, 305 205 C 340 225, 380 225, 392 190 C 385 230, 345 248, 310 230 C 265 205, 235 155, 195 145 C 165 138, 140 150, 138 172 C 137 182, 142 192, 150 198 C 138 192, 128 182, 125 168 Z" fill="url(#ribbonRightGrad)" />

    <!-- Sprouting Eco Leaves on the Right -->
    <!-- Top Leaf -->
    <path d="M 370 160 C 370 125, 400 95, 435 85 C 440 115, 425 155, 392 168 C 380 172, 372 168, 370 160 Z" fill="url(#leafGrad1)" />
    <path d="M 375 158 Q 405 130 435 85" stroke="#ecfdf5" stroke-width="2" fill="none" opacity="0.6" />

    <!-- Bottom Leaf -->
    <path d="M 315 140 C 315 115, 335 95, 365 95 C 370 118, 358 145, 332 152 C 322 155, 316 150, 315 140 Z" fill="url(#leafGrad2)" />
    <path d="M 318 140 Q 340 120 365 95" stroke="#ecfdf5" stroke-width="1.5" fill="none" opacity="0.6" />
  </g>

  <!-- Typography: Teraloop Wordmark with Infinity 'oo' -->
  <g id="teraloop-text" transform="translate(0, 310)">
    <!-- 'T' -->
    <path d="M 45 42 L 85 42 L 85 54 L 69 54 L 69 98 L 55 98 L 55 54 L 45 54 Z" fill="#043e2e" />
    <!-- 'e' -->
    <path d="M 112 70 C 112 56, 122 47, 136 47 C 150 47, 158 56, 158 71 L 158 75 L 105 75 C 106 85, 114 91, 124 91 C 131 91, 137 88, 141 83 L 152 90 C 146 98, 136 102, 124 102 C 107 102, 95 90, 95 73 C 95 57, 106 47, 121 47 C 137 47, 147 57, 147 73 L 147 75 Z M 134 58 C 126 58, 120 63, 118 70 L 144 70 C 143 63, 138 58, 134 58 Z" fill="#043e2e" />
    <!-- 'r' -->
    <path d="M 168 50 L 180 50 L 180 58 C 184 52, 191 48, 199 49 L 199 63 C 190 62, 182 67, 182 77 L 182 98 L 168 98 Z" fill="#043e2e" />
    <!-- 'a' -->
    <path d="M 235 50 L 248 50 L 248 98 L 235 98 L 235 90 C 230 96, 222 100, 212 100 C 198 100, 188 90, 188 75 C 188 60, 200 50, 215 50 C 224 50, 231 54, 235 59 Z M 218 62 C 209 62, 202 68, 202 75 C 202 82, 209 88, 218 88 C 227 88, 235 82, 235 75 C 235 68, 227 62, 218 62 Z" fill="#043e2e" />
    <!-- 'l' -->
    <path d="M 258 35 L 272 35 L 272 98 L 258 98 Z" fill="#043e2e" />

    <!-- Infinity 'oo' in Teraloop -->
    <g transform="translate(280, 48)">
      <!-- Left O of infinity -->
      <path d="M 45 26 C 45 12, 33 2, 22 2 C 10 2, 0 12, 0 26 C 0 40, 10 50, 22 50 C 33 50, 42 42, 50 31 C 58 42, 67 50, 78 50 C 90 50, 100 40, 100 26 C 100 12, 90 2, 78 2 C 67 2, 58 10, 50 21 C 42 10, 33 2, 22 2 Z M 22 13 C 29 13, 35 19, 35 26 C 35 33, 29 39, 22 39 C 15 39, 10 33, 10 26 C 10 19, 15 13, 22 13 Z M 78 13 C 85 13, 90 19, 90 26 C 90 33, 85 39, 78 39 C 71 39, 65 33, 65 26 C 65 19, 71 13, 78 13 Z" fill="url(#infinityLoopGrad)" />
    </g>

    <!-- 'p' -->
    <path d="M 392 50 L 405 50 L 405 59 C 410 53, 417 48, 427 48 C 442 48, 454 60, 454 75 C 454 90, 442 102, 427 102 C 417 102, 410 97, 405 91 L 405 118 L 392 118 Z M 422 61 C 413 61, 405 67, 405 75 C 405 83, 413 89, 422 89 C 431 89, 439 83, 439 75 C 439 67, 431 61, 422 61 Z" fill="#043e2e" />
  </g>

  <!-- Tagline: SUSTAINABLE TOMORROW, TOGETHER -->
  <text x="250" y="445" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" letter-spacing="4.5" fill="#0f3c2f">SUSTAINABLE TOMORROW, TOGETHER</text>
</svg>
